name: Add Brodyaga slot guard

on:
  push:
    paths:
      - "brodyaga.html"
      - ".github/workflows/add-brodyaga-slot-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add slot guard
        shell: python
        run: |
          from pathlib import Path

          path = Path("brodyaga.html")
          text = path.read_text(encoding="utf-8")

          marker = "VEX_BOOKING_SLOT_GUARD_V1"
          if marker in text:
              print("Slot guard already installed")
              raise SystemExit(0)

          script = r'''<style id="vex-slot-guard-style">
          .vex-time.busy-slot{opacity:.28!important;cursor:not-allowed!important;text-decoration:line-through!important;position:relative}
          .vex-time.busy-slot:hover{background:transparent!important;color:var(--ink)!important;transform:none!important}
          </style>
          <script id="vex-slot-guard-script">
          /* VEX_BOOKING_SLOT_GUARD_V1 */
          (() => {
            const API = "https://vex-booking.zervex52.workers.dev/";
            const booked = new Set();
            let lastDate = "";
            let availabilityRequest = null;

            function normalizeDate(value){
              const m = String(value || "").match(/\\b(20\\d{2}-\\d{2}-\\d{2})\\b/);
              return m ? m[1] : "";
            }

            function findDate(){
              const root = document.querySelector("#bookingContent");
              if(!root) return "";

              const nodes = root.querySelectorAll("[data-date],button,input,[class*=date],[class*=choice],p,span,div");
              for(const node of nodes){
                const d = normalizeDate(node.getAttribute("data-date"));
                if(d) return d;
                const t = normalizeDate(node.textContent);
                if(t) return t;
              }

              return normalizeDate(root.textContent);
            }

            function paint(){
              document.querySelectorAll("#bookingContent .vex-time").forEach(btn => {
                const time = (btn.textContent || "").trim();
                const busy = booked.has(time);
                btn.classList.toggle("busy-slot", busy);
                btn.disabled = busy;
                btn.setAttribute("aria-disabled", busy ? "true" : "false");
                if(busy) btn.title = "Это время уже занято";
              });
            }

            async function loadAvailability(){
              const date = findDate();
              if(!date || date === lastDate) {
                paint();
                return;
              }

              lastDate = date;
              booked.clear();

              try{
                availabilityRequest = fetch(`${API}availability?date=${encodeURIComponent(date)}`, {cache:"no-store"});
                const response = await availabilityRequest;
                const data = await response.json();

                if(data && Array.isArray(data.busy)){
                  data.busy.forEach(time => booked.add(String(time).trim()));
                }
              }catch(error){
                console.warn("VEX Booking availability error:", error);
              }finally{
                availabilityRequest = null;
                paint();
              }
            }

            const originalFetch = window.fetch.bind(window);
            window.fetch = async (...args) => {
              const response = await originalFetch(...args);

              try{
                const request = args[0];
                const url = typeof request === "string" ? request : request?.url || "";

                if(url.includes("vex-booking.zervex52.workers.dev") && response.status === 409){
                  alert("Это время уже занято. Выбери другое время.");
                  booked.add(document.querySelector("#bookingContent .vex-time.selected")?.textContent?.trim() || "");
                  paint();
                }
              }catch(error){
                console.warn("VEX Booking guard error:", error);
              }

              return response;
            };

            const observer = new MutationObserver(() => {
              const times = document.querySelectorAll("#bookingContent .vex-time");
              if(times.length){
                loadAvailability();
                paint();
              }else{
                lastDate = "";
                booked.clear();
              }
            });

            observer.observe(document.documentElement, {subtree:true, childList:true});

            document.addEventListener("click", event => {
              const button = event.target.closest?.("#bookingContent .vex-time");
              if(button && button.disabled){
                event.preventDefault();
                event.stopImmediatePropagation();
                alert("Это время уже занято. Выбери другое время.");
              }
            }, true);

            setTimeout(loadAvailability, 300);
          })();
          </script>'''

          if "</body>" not in text:
              raise SystemExit("</body> not found")

          text = text.replace("</body>", script + "\n</body>", 1)
          path.write_text(text, encoding="utf-8")
          print("Slot guard installed")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brodyaga.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: block occupied Brodyaga booking slots"
          git push
