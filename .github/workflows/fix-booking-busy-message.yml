name: Fix booking busy message

on:
  push:
    paths:
      - '.github/workflows/fix-booking-busy-message.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch booking error handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('brodyaga.html')
          s = p.read_text(encoding='utf-8')

          old = """    }catch(err){\n      if(button){button.disabled=false;button.textContent='Отправить запись'}\n      alert('Не удалось отправить заявку. Попробуйте ещё раз.');\n      console.error(err);\n    }"""

          new = """    }catch(err){\n      if(button){button.disabled=false;button.textContent='Отправить запись'}\n      if(err && err.message === 'SLOT_BUSY'){\n        alert('Это время уже занято. Выберите другое время.');\n        return;\n      }\n      alert('Не удалось отправить заявку. Попробуйте ещё раз.');\n      console.error(err);\n    }"""

          if old not in s:
              raise SystemExit('Target catch block not found')

          s = s.replace(old, new, 1)

          old2 = """      const data=await r.json().catch(()=>({}));\n      if(!r.ok || !data.ok) throw new Error(data.error||'Ошибка отправки');"""
          new2 = """      const data=await r.json().catch(()=>({}));\n      if(r.status===409 || data.error==='Это время уже занято') throw new Error('SLOT_BUSY');\n      if(!r.ok || !data.ok) throw new Error(data.error||'Ошибка отправки');"""

          if old2 not in s:
              raise SystemExit('Target response block not found')

          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brodyaga.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show occupied slot message'
          git push