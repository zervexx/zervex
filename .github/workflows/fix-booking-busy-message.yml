name: Fix booking busy message

on:
  push:
    paths:
      - '.github/workflows/fix-booking-busy-message.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch booking error handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('brodyaga.html')
          s = p.read_text(encoding='utf-8')

          # Handle every booking submit handler in the page.
          s = s.replace(
              "if(!r.ok || !data.ok) throw new Error(data.error||'Ошибка отправки');",
              "if(r.status===409 || data.error==='Это время уже занято') throw new Error('SLOT_BUSY');\n      if(!r.ok || !data.ok) throw new Error(data.error||'Ошибка отправки');"
          )

          s = s.replace(
              "alert('Не удалось отправить заявку. Попробуйте ещё раз.');",
              "if(err && err.message === 'SLOT_BUSY'){\n        alert('Это время уже занято. Выберите другое время.');\n        return;\n      }\n      alert('Не удалось отправить заявку. Попробуйте ещё раз.');"
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brodyaga.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show occupied slot message'
          git pull --rebase origin main
          git push