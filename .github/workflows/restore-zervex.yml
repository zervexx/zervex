name: Restore ZERVEX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild original homepage
        shell: bash
        run: |
          if [ -d _restore ]; then
            python - <<'PY'
from pathlib import Path
parts=sorted(Path('_restore').glob('*.part'))
if parts:
    Path('index.html').write_text(''.join(p.read_text() for p in parts), encoding='utf-8')
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git diff --cached --quiet || git commit -m 'Restore original ZERVEX homepage'
            git push
          fi
