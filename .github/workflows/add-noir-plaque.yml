name: Add Noir plaque
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add Noir plaque applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add plaque
        shell: python
        run: |
          from pathlib import Path
          p=Path('noir.html')
          s=p.read_text(encoding='utf-8')
          import re
          css='''<style id="zervex-old-preview-bar">.preview-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;width:min(920px,calc(100% - 28px));height:58px;display:flex;align-items:center;gap:18px;padding:0 10px 0 18px;overflow:hidden;border:1px solid rgba(188,162,123,.28);background:rgba(9,8,7,.9);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.5)}.preview-ticker{min-width:0;flex:1;overflow:hidden;white-space:nowrap;color:#a9a094;font:500 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.preview-track{display:inline-flex;width:max-content;animation:previewMarquee 18s linear infinite}.preview-track span{padding-right:60px}.preview-back{flex:none;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border:1px solid #8d7a5e;color:#eee7da;background:#11100e;font:600 10px Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:.3s}.preview-back:hover{background:#eee7da;color:#0c0b09;transform:translateY(-1px)}@keyframes previewMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}body{padding-bottom:92px}@media(max-width:560px){.preview-bar{bottom:10px;height:52px;gap:10px;padding-left:12px}.preview-back{height:36px;padding:0 11px;font-size:9px}.preview-ticker{font-size:8px;letter-spacing:.13em}}@media(prefers-reduced-motion:reduce){.preview-track{animation:none}}</style>'''
          markup='<div class="preview-bar"><div class="preview-ticker"><div class="preview-track"><span>ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · </span><span>ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · </span></div></div><a class="preview-back" href="index.html">← Вернуться на ZERVEX</a></div>'
          s=re.sub(r'<style id="zervex-old-preview-bar">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<style>\.preview-bar\{.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          s=re.sub(r'<div class="preview-bar">.*?</div>\s*</div>', '', s, count=1, flags=re.S)
          s=s.replace('</body>',markup+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          rm -f .github/workflows/add-noir-plaque.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noir.html .github/workflows/add-noir-plaque.yml
          git commit -m "Add Noir plaque applied"
          git push
