name: Restore old plaques
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore old plaques') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore plaques
        shell: python
        run: |
          from pathlib import Path
          css = '''<style id="zervex-old-preview-bar">.preview-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;width:min(920px,calc(100% - 28px));height:58px;display:flex;align-items:center;gap:18px;padding:0 10px 0 18px;overflow:hidden;border:1px solid rgba(231,233,235,.16);background:rgba(8,9,10,.88);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.42)}.preview-ticker{min-width:0;flex:1;overflow:hidden;white-space:nowrap;color:#8f949a;font:500 10px Manrope,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.preview-track{display:inline-flex;width:max-content;animation:previewMarquee 18s linear infinite}.preview-track span{padding-right:60px}.preview-back{flex:none;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border:1px solid rgba(231,233,235,.24);color:#e7e9eb;background:#101214;font:600 11px Manrope,Arial,sans-serif;letter-spacing:.04em;transition:.3s}.preview-back:hover{background:#e7e9eb;color:#08090a;transform:translateY(-1px)}@keyframes previewMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}body{padding-bottom:92px}@media(max-width:560px){.preview-bar{bottom:10px;height:52px;gap:10px;padding-left:12px}.preview-back{height:36px;padding:0 11px;font-size:10px}.preview-ticker{font-size:8px;letter-spacing:.13em}}@media(prefers-reduced-motion:reduce){.preview-track{animation:none}}</style>'''
          markup = '<div class="preview-bar"><div class="preview-ticker"><div class="preview-track"><span>ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · </span><span>ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · ПРЕДПРОСМОТР ПРОЕКТА · ZERVEX PORTFOLIO · </span></div></div><a class="preview-back" href="index.html">← Вернуться на ZERVEX</a></div>'
          for name in ['brodyaga.html','noir.html']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              import re
              s=re.sub(r'<style id="zervex-old-preview-bar">.*?</style>','',s,flags=re.S)
              s=re.sub(r'<style>\.preview-bar\{.*?</style>','',s,flags=re.S)
              s=s.replace('</head>',css+'</head>',1)
              s=re.sub(r'<div class="preview-bar">.*?</div>\s*</div>', '', s, count=1, flags=re.S)
              s=s.replace('</body>',markup+'</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/restore-old-plaques.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brodyaga.html noir.html .github/workflows/restore-old-plaques.yml
          git commit -m "Restore old plaques"
          git push
