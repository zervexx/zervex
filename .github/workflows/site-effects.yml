name: Site effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-effects:
    if: ${{ !contains(github.event.head_commit.message, 'Apply site effects') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site files
        shell: python
        run: |
          from pathlib import Path
          import re

          dust_css = r'''<style id="zervex-dust">
          .zx-dust{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
          .zx-dust i{position:absolute;top:-12px;width:2px;height:2px;border-radius:50%;background:#d9c9ff;opacity:.24;box-shadow:0 0 7px #b98cff;animation:zxfall linear infinite}
          .zx-dust i:nth-child(3n){width:1px;height:1px;opacity:.14;box-shadow:none}
          .zx-dust i:nth-child(4n){width:3px;height:3px;opacity:.12;box-shadow:0 0 9px #b98cff}
          @keyframes zxfall{from{transform:translate3d(0,-20px,0)}to{transform:translate3d(24px,110vh,0)}}
          @media(max-width:900px){.zx-dust i{opacity:.17}.zx-dust i:nth-child(4n){opacity:.09}}
          @media(prefers-reduced-motion:reduce){.zx-dust{display:none}}
          </style>'''
          particles = '<div class="zx-dust" aria-hidden="true">' + ''.join(f'<i style="left:{(i*29)%101}%;animation-delay:-{(i*0.73):.2f}s;animation-duration:{10+(i%8)*.9:.1f}s"></i>' for i in range(34)) + '</div>'

          demo_css = r'''<style id="zervex-demo-notice">
          .zx-demo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;width:min(680px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 14px 12px 18px;border:1px solid rgba(190,150,255,.28);border-radius:16px;background:rgba(10,7,18,.88);backdrop-filter:blur(18px);box-shadow:0 16px 55px rgba(0,0,0,.38),0 0 35px rgba(142,76,255,.10);font:12px Manrope,Arial,sans-serif;color:#c9c0d5}.zx-demo strong{color:#f4efff;font-weight:700}.zx-demo a{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border-radius:10px;background:linear-gradient(135deg,#eee7ff,#9b5cff);color:#160b24;font-weight:800;text-decoration:none;white-space:nowrap}.zx-demo a:hover{transform:translateY(-1px)}@media(max-width:560px){.zx-demo{bottom:10px;padding:10px 11px 10px 13px;gap:10px}.zx-demo span{font-size:11px}.zx-demo a{padding:8px 10px;font-size:11px}}
          </style>'''
          demo_markup = '<div class="zx-demo"><span><strong>Демонстрационный сайт</strong> · концепт для портфолио</span><a href="index.html">Вернуться на ZERVEX ↗</a></div>'

          for name in ['index.html','brodyaga.html','noir.html','eirn.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'id="zervex-dust"' not in s:
                  s=s.replace('</head>', dust_css + '</head>', 1)
              if 'class="zx-dust"' not in s:
                  s=s.replace('<body', particles + '<body', 1)
              if name != 'index.html':
                  if 'id="zervex-demo-notice"' not in s:
                      s=s.replace('</head>', demo_css + '</head>', 1)
                  if 'class="zx-demo"' not in s:
                      s=s.replace('</body>', demo_markup + '</body>', 1)
              p.write_text(s,encoding='utf-8')
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brodyaga.html noir.html eirn.html
          git diff --cached --quiet || git commit -m "Apply site effects"
          git push