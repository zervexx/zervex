name: Diagnose VEX endpoint

on:
  push:
    paths:
      - .github/workflows/diagnose-vex-endpoint.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and GET
        run: |
          set +e
          echo '--- DNS ---'
          getent hosts vex-booking.zervex52.workers.dev || true
          echo '--- GET ---'
          curl -sS -i --max-time 20 'https://vex-booking.zervex52.workers.dev/' || true
          echo '--- AVAILABILITY ---'
          curl -sS -i --max-time 20 'https://vex-booking.zervex52.workers.dev/availability?date=2026-09-17' || true
      - name: Check CORS preflight
        run: |
          echo '--- OPTIONS ---'
          curl -sS -i --max-time 20 -X OPTIONS 'https://vex-booking.zervex52.workers.dev/' \
            -H 'Origin: https://zervexx.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true
      - name: Remove diagnostic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/contents/.github/workflows/diagnose-vex-endpoint.yml \
            -f message='chore: remove temporary endpoint diagnostic' \
            -f sha='$(git rev-parse HEAD)' || true
