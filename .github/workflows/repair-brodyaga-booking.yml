name: Repair Brodyaga Booking

on:
  push:
    paths:
      - '.github/workflows/repair-brodyaga-booking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking alert text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('brodyaga.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("alert('Это время уже занято. Выберите другое время.');", "alert('Время уже забронировано. Выберите другое время.');")
          s=s.replace('alert("Это время уже занято. Выберите другое время.");', 'alert("Время уже забронировано. Выберите другое время.");')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add brodyaga.html
          git diff --cached --quiet && exit 0
          git commit -m 'copy: improve occupied slot message'
          git push
